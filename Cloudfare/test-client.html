<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudflare D1 Lab</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;background:#f5f1e8;color:#20252b}button{padding:.7rem 1rem;margin:.25rem}textarea,input{display:block;width:100%;box-sizing:border-box;margin:.4rem 0;padding:.7rem}pre{background:#20252b;color:#e8f0ec;padding:1rem;overflow:auto;min-height:10rem}</style></head><body><h1>Cloudflare D1 Lab</h1><p>Prueba aislada de chats y carpetas. Cambia <code>API_BASE</code> si Wrangler corre en otro puerto.</p><input id="name" value="Chat de prueba"><textarea id="messages">[{"role":"user","text":"Hola desde D1"}]</textarea><button id="save">Guardar chat</button><button id="load">Cargar chats</button><button id="health">Health</button><pre id="out">Listo.</pre><script>const API_BASE='';const out=document.querySelector('#out');const call=async(path,options)=>{const r=await fetch(API_BASE+path,{headers:{'content-type':'application/json'},...options});const d=await r.json();out.textContent=JSON.stringify({status:r.status,data:d},null,2)};health.onclick=()=>call('/health');save.onclick=()=>call('/chats/d1-test',{method:'PUT',body:JSON.stringify({name:name.value,messages:JSON.parse(messages.value)})});load.onclick=()=>call('/chats');</script></body></html>
