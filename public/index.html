<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Emoji picker (shared, positioned by JS) -->
  <div class="emoji-picker" id="emojiPicker">
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <!-- Sidebar: folders + chat list -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Chats</span>
      <div class="sidebar-actions">
        <button class="btn-icon" id="newFolderBtn" title="Nueva carpeta">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/>
          </svg>
        </button>
        <button class="btn-icon btn-icon-accent" id="newChatBtn" title="Nuevo chat">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14l4-4h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c.55 0 1 .45 1 1v3h3c.55 0 1 .45 1 1s-.45 1-1 1h-3v3c0 .55-.45 1-1 1s-1-.45-1-1v-3H8c-.55 0-1-.45-1-1s.45-1 1-1h3V7c0-.55.45-1 1-1z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Main chat area -->
  <div class="main" id="main">

    <!-- Top bar -->
    <div class="topbar">
      <button class="btn-toggle-sidebar" id="toggleSidebar" title="Chats">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      <span class="topbar-title" id="chatTitle">Nuevo chat</span>
      <button class="btn-tts-auto" id="ttsAutoBtn" title="Reproducir respuestas automáticamente">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <button class="btn-settings" id="settingsBtn" title="System prompt">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>

    <!-- Settings modal (system prompt + rename) -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal">
        <div class="modal-header">
          <span>Configuración del chat</span>
          <button class="modal-close" id="closeSettings">✕</button>
        </div>
        <div class="modal-field">
          <label class="modal-label">Nombre del chat</label>
          <div class="modal-name-row">
            <button class="btn-emoji-pick" id="chatEmojiBtn" title="Emoji">😀</button>
            <input type="text" id="chatNameInput" class="modal-input" placeholder="Nombre del chat" />
          </div>
        </div>
        <div class="modal-field">
          <label class="modal-label">System Prompt</label>
          <textarea id="systemPrompt" placeholder="Instrucciones para la IA en este chat..." rows="5"></textarea>
        </div>
        <div class="modal-actions">
          <button id="saveSystemPrompt">Guardar</button>
          <button id="clearHistory" class="btn-danger">Limpiar conversación</button>
        </div>
      </div>
    </div>

    <!-- Folder modal -->
    <div class="modal-overlay" id="folderModal">
      <div class="modal">
        <div class="modal-header">
          <span id="folderModalTitle">Nueva carpeta</span>
          <button class="modal-close" id="closeFolderModal">✕</button>
        </div>
        <div class="modal-field">
          <label class="modal-label">Nombre de la carpeta</label>
          <div class="modal-name-row">
            <button class="btn-emoji-pick" id="folderEmojiBtn" title="Emoji">📁</button>
            <input type="text" id="folderNameInput" class="modal-input" placeholder="Ej: Language Learning" />
          </div>
        </div>
        <div class="modal-field">
          <label class="modal-label">System Prompt (heredado por chats hijos)</label>
          <textarea id="folderPrompt" placeholder="Instrucciones compartidas para todos los chats de esta carpeta..." rows="4"></textarea>
        </div>
        <div class="modal-actions">
          <button id="saveFolderBtn">Guardar</button>
          <button id="deleteFolderBtn" class="btn-danger" style="display:none">Eliminar carpeta</button>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="empty-state">
        Presiona el micrófono para hablar o escribe un mensaje
      </div>
    </div>

    <!-- Recording overlay (lock mode) -->
    <div class="rec-overlay" id="recOverlay">
      <div class="rec-timer" id="recTimer">0:00</div>
      <div class="rec-waveform" id="recWaveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="rec-hint">Grabando — bloqueado</div>
      <div class="rec-overlay-actions">
        <button class="rec-btn-cancel" id="recCancelBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
          Cancelar
        </button>
        <button class="rec-btn-send" id="recSendBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          Enviar
        </button>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <!-- Slide-up lock hint (shown while holding) -->
      <div class="lock-hint" id="lockHint">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        Desliza arriba para bloquear
      </div>

      <textarea
        id="textInput"
        placeholder="Escribe un mensaje..."
        rows="1"
      ></textarea>

      <button id="sendText" class="btn-send" title="Enviar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>

      <div class="mic-wrap" id="micWrap">
        <button id="recordBtn" class="btn-record" title="Mantén o toca para grabar">
          <svg class="icon-mic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <svg class="icon-stop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none">
            <path d="M6 6h12v12H6z"/>
          </svg>
        </button>
        <div class="btn-timer" id="btnTimer" style="display:none">0:00</div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
