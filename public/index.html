<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- System Prompt -->
    <details class="system-prompt-panel" id="systemPromptPanel">
      <summary>System Prompt</summary>
      <textarea
        id="systemPrompt"
        placeholder="Escribe aquí el system prompt (instrucciones para la IA)..."
        rows="4"
      ></textarea>
      <div class="system-prompt-actions">
        <button id="saveSystemPrompt">Guardar</button>
        <button id="clearHistory" class="btn-danger">Limpiar conversación</button>
      </div>
    </details>

    <!-- Chat messages -->
    <div class="chat-container" id="chatContainer">
      <div class="empty-state" id="emptyState">
        Presiona el micrófono para hablar o escribe un mensaje
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <textarea
        id="textInput"
        placeholder="Escribe un mensaje..."
        rows="1"
      ></textarea>
      <button id="sendText" class="btn-send" title="Enviar texto">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
      <button id="recordBtn" class="btn-record" title="Mantén presionado para grabar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>

    <!-- Recording indicator -->
    <div class="recording-indicator" id="recordingIndicator">
      <span class="pulse"></span> Grabando... suelta para enviar
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
